<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel de Fichas</title><style>
*{box-sizing:border-box}body{background:#080d12;color:#b4ffcb;font:15px system-ui;margin:0}header{padding:22px;border-bottom:1px solid #1e5c3a}main{max-width:1100px;margin:auto;padding:18px}input,button{font:inherit;padding:12px;border-radius:8px}input{background:#101e18;color:#fff;border:1px solid #387d51;max-width:300px}button{border:1px solid #37a365;background:#123d28;color:#b4ffcb;cursor:pointer}button:hover{background:#1c5a3b}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.card{border:1px solid #28583c;background:#101c16;padding:16px;border-radius:12px;margin:12px 0;overflow-wrap:anywhere}.meta{color:#88b99c;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin:10px 0}strong{color:white}h1{font-size:22px}#status{margin:10px 0;color:#f9db83}
</style></head><body><header><h1>GM Campaign Intelligence — Painel de Fichas</h1></header><main><p>Acesso exclusivo do administrador. A senha não é salva no navegador.</p><input id="senha" type="password" placeholder="Senha do administrador" autocomplete="off"><div class="actions"><button onclick="carregar()">Entrar / Atualizar</button><button onclick="copiarTodas()">Copiar todas</button></div><div id="status"></div><div id="lista"></div></main><script>
let fichas=[],senha='';const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function idade(s){if(!s)return 'Não informada';let d;if(/^\d{2}\/\d{2}\/\d{4}$/.test(s)){let [dia,mes,ano]=s.split('/');d=new Date(+ano,+mes-1,+dia)}else d=new Date(s);if(isNaN(d))return 'Não informada';let hoje=new Date(),a=hoje.getFullYear()-d.getFullYear();if(hoje.getMonth()<d.getMonth()||(hoje.getMonth()===d.getMonth()&&hoje.getDate()<d.getDate()))a--;return a>=0&&a<125?a+' anos':'Não informada'}
const texto=f=>`Nome: ${f.nome}\nCPF: ${f.cpf}\nIdade: ${idade(f.data_nascimento)}\nNascimento: ${f.data_nascimento}\nWhatsApp: ${f.telefone}\nTítulos: ${f.quantidade}\nValor: R$ ${Number(f.valor).toFixed(2)}\nStatus: ${f.status}\nTransação: ${f.id}\nData: ${f.criado_em}`;
async function carregar(){senha=$('senha').value||senha;if(!senha){$('status').textContent='Informe a senha.';return}try{const r=await fetch('/api/fichas',{headers:{Authorization:'Bearer '+senha},cache:'no-store'}),j=await r.json();if(!r.ok)throw Error(j.error);fichas=j.fichas;$('status').textContent=fichas.length+' ficha(s)';$('lista').innerHTML=fichas.map((f,i)=>`<div class="card"><div class="grid"><div><small>Nome</small><br><strong>${esc(f.nome)}</strong></div><div><small>Idade</small><br><strong>${esc(idade(f.data_nascimento))}</strong></div><div><small>CPF</small><br>${esc(f.cpf)}</div><div><small>WhatsApp</small><br>${esc(f.telefone)}</div><div><small>Títulos</small><br>${esc(f.quantidade)}</div><div><small>Total</small><br>R$ ${Number(f.valor).toFixed(2)}</div></div><div class="meta">${esc(f.status)} · ${esc(f.criado_em)} · ${esc(f.id)}</div><div class="actions"><button onclick="copiar(${i})">Copiar ficha</button><button onclick="excluir(${i})">Excluir ficha</button></div></div>`).join('')}catch(e){$('status').textContent=e.message}}
function copiar(i){navigator.clipboard.writeText(texto(fichas[i]))}function copiarTodas(){navigator.clipboard.writeText(fichas.map(texto).join('\n\n---\n\n'))}
async function excluir(i){if(!confirm('Excluir esta ficha permanentemente?'))return;const r=await fetch('/api/fichas?id='+encodeURIComponent(fichas[i].id),{method:'DELETE',headers:{Authorization:'Bearer '+senha}});if(r.ok)carregar();else alert('Não foi possível excluir')}
</script></body></html>
